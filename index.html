<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Dashboard - Управление производством</title>
  <!-- Подключаем Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
 <style>
  @media print {
    /* Скрываем вообще всё на странице по умолчанию */
    body * {
      visibility: hidden;
    }
    
    /* Делаем видимой только ту секцию, которой добавлен класс печати */
    .only-print-section, .only-print-section * {
      visibility: visible;
    }
    
    /* Перемещаем выбранную секцию в левый верхний угол листа */
    .only-print-section {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      margin: 0 !important;
      padding: 10px !important;
      border: none !important;
      box-shadow: none !important;
      background: white !important;
    }
    
    /* Автоматически скрываем кнопки (Печать, Удалить, Готово) при печати */
    .no-print {
      display: none !important;
    }
  }
</style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen p-4 md:p-8 lg:p-12">

  <!-- Основной контейнер с ограничением ширины и отступами со всех сторон -->
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Шапка дашборда -->
<header class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 md:p-8 rounded-3xl border border-stone-200/80 shadow-sm">
  <div>
    <h1 class="text-2xl md:text-3xl font-black text-stone-900 tracking-tight">ERP Dashboard</h1>
    <p class="text-xs md:text-sm text-stone-500 mt-1">Production & Order Management</p>
  </div>
  
  <div class="flex items-center flex-wrap gap-3 w-full sm:w-auto justify-between sm:justify-end">
    <!-- Дата -->
    <div id="current-date" class="text-xs md:text-sm font-semibold text-stone-700 bg-stone-50 px-4 py-2.5 rounded-2xl border border-stone-200 shadow-inner">
    </div>
    
    <!-- Время последнего обновления (сюда JS подставит текст из script.js) -->
    <div id="last-update-time" class="text-xs md:text-sm font-semibold text-stone-600 bg-stone-50 px-4 py-2.5 rounded-2xl border border-stone-200">
      Updated: ---
    </div>

    <!-- Кнопка обновления -->
    <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-medium px-4 py-2.5 rounded-2xl transition-colors shadow-sm flex items-center space-x-1.5 cursor-pointer">
      <span>🔄 Refresh</span>
    </button>
  </div>
</header>

    <!-- Основное содержимое (таблицы, карточки, формы) -->
    <main id="dashboard-container" class="space-y-6"></main>

  </div>
  <script>
  document.addEventListener('click', (e) => {
    // Ищем кнопку печати, по которой кликнули
    const printBtn = e.target.closest('button[id^="print-"][id$="-table"]');
    if (!printBtn) return;

    // Останавливаем стандартный вызов пустой печати из script.js
    e.stopImmediatePropagation();

    // Находим карточку/секцию, внутри которой лежит эта кнопка и её таблица
    const section = printBtn.closest('section') 
                 || printBtn.closest('.bg-white') 
                 || printBtn.closest('div[id]');

    if (!section) {
      alert('Не удалось определить секцию для печати.');
      return;
    }

    // Убираем класс печати со всех элементов и вешаем на выбранную секцию
    document.querySelectorAll('.only-print-section').forEach(el => {
      el.classList.remove('only-print-section');
    });
    section.classList.add('only-print-section');

    // Запускаем печать
    window.print();

    // Очищаем класс после печати
    setTimeout(() => {
      section.classList.remove('only-print-section');
    }, 500);
  }, true); // true перехватывает клик раньше, чем сработает script.js
</script>

<!-- Подключаем Supabase клиент через CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Подключаем скомпилированный скрипт -->
  <script src="script.js"></script>
</body>
</html>
